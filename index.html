<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magdalene SCADA Survey</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#eef2f5}header{background:#005a9c;color:#fff;padding:14px;text-align:center}section{display:none;padding:12px}.active{display:block}.card{background:#fff;padding:12px;border-radius:10px;margin-bottom:10px}input,select,textarea{width:100%;padding:10px;margin:4px 0 10px;box-sizing:border-box}button{background:#005a9c;color:#fff;border:none;padding:10px 14px;border-radius:6px}.nav{display:flex;justify-content:space-between}.progress{height:8px;background:#ccc}.bar{height:8px;background:#005a9c;width:0%}canvas{border:1px solid #999;width:100%;height:180px}</style>
</head><body><header>Magdalene SCADA Survey</header><div class="progress"><div id="bar" class="bar"></div></div>
<section id="s0" class="active"><div class="card"><h2>Home</h2><button onclick="go(1)">New Survey</button></div></section>
<section id="s1"><div class="card"><h3>Site Details</h3><input id="surveyor" placeholder="Surveyor"><input id="site" placeholder="Site Name"><input id="gps" placeholder="GPS"><button onclick="gps()">Capture GPS</button></div><div class="nav"><button onclick="go(0)">Back</button><button onclick="go(2)">Next</button></div></section>
<section id="s2"><div class="card"><h3>Safety</h3><label><input type="checkbox"> JSSP Complete</label><label><input type="checkbox"> DRA Complete</label></div><div class="nav"><button onclick="go(1)">Back</button><button onclick="go(3)">Next</button></div></section>
<section id="s3"><div class="card"><h3>Access & Security</h3><input placeholder="HV Supervisor"><input placeholder="Gate Code"><textarea placeholder="Access Issues"></textarea></div><div class="nav"><button onclick="go(2)">Back</button><button onclick="go(4)">Next</button></div></section>
<section id="s4"><div class="card"><h3>Pole Survey</h3><input placeholder="Pole ID"><select><option>Wooden</option><option>Steel</option></select><textarea placeholder="Comments"></textarea></div><div class="nav"><button onclick="go(3)">Back</button><button onclick="go(5)">Next</button></div></section>
<section id="s5"><div class="card"><h3>Antenna & Radio</h3><input placeholder="Antenna Type"><input placeholder="Radio Model"></div><div class="nav"><button onclick="go(4)">Back</button><button onclick="go(6)">Next</button></div></section>
<section id="s6"><div class="card"><h3>Lightning & DWA</h3><select><option>Installed</option><option>Not Installed</option></select><textarea placeholder="DWA Notes"></textarea></div><div class="nav"><button onclick="go(5)">Back</button><button onclick="go(7)">Next</button></div></section>
<section id="s7"><div class="card"><h3>Photos</h3><input type="file" accept="image/*" capture="environment" multiple></div><div class="nav"><button onclick="go(6)">Back</button><button onclick="go(8)">Next</button></div></section>
<section id="s8"><div class="card"><h3>Outcome</h3><select><option>Suitable</option><option>Further Survey</option></select><textarea placeholder="Recommendation"></textarea></div><div class="nav"><button onclick="go(7)">Back</button><button onclick="go(9)">Next</button></div></section>
<section id="s9"><div class="card"><h3>Signature</h3><canvas id="sig"></canvas><br><button onclick="clearSig()">Clear</button><button onclick="save()">Save Survey</button></div></section>
<script>
const total=9;function go(n){document.querySelectorAll('section').forEach(x=>x.classList.remove('active'));document.getElementById('s'+n).classList.add('active');document.getElementById('bar').style.width=(n/total*100)+'%'}
function gps(){navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>gps.value=p.coords.latitude+','+p.coords.longitude)}
const c=document.getElementById('sig'),ctx=c.getContext('2d');c.width=600;c.height=180;let d=false;c.onpointerdown=e=>{d=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)};c.onpointermove=e=>{if(d){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()}};window.onpointerup=()=>d=false;function clearSig(){ctx.clearRect(0,0,c.width,c.height)}
function save(){localStorage.setItem('survey',JSON.stringify({site:document.getElementById('site').value,surveyor:document.getElementById('surveyor').value,date:new Date().toISOString(),signature:c.toDataURL()}));alert('Survey saved');}
</script></body></html>
